<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F5D061"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Typography: 3AFRET ONLY (No Arabic word, No Shield, No Dot) -->
  <text 
    x="130" 
    y="51" 
    text-anchor="middle" 
    font-family="'Montserrat', 'Arial Black', 'Cairo', 'Tajawal', sans-serif" 
    font-weight="900" 
    font-size="46" 
    fill="url(#goldGrad)" 
    letter-spacing="4" 
    filter="url(#goldGlow)"
  >
    3AFRET
  </text>
</svg>
